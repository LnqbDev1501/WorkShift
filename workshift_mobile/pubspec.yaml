name: workshift_mobile
description: "WorkShift staff scheduling, attendance, and payroll application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  geolocator: ^14.1.1
  camera: ^0.12.1
  google_mlkit_face_detection: ^0.15.1
  signalr_netcore: ^1.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/sample_face.jpg
    - assets/images/login.jpg
    - assets/images/forgotpassword.jpg
    - assets/images/workshift_stamp.png
